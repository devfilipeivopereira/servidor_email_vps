version: "3.8"

# Activate only after the DNS, PTR and relay checks in README have passed.
# It reuses the bootstrap volumes and Traefik instance on the current VPS.
services:
  stalwart:
    image: ${STALWART_IMAGE:-stalwartlabs/stalwart:v0.16}
    environment:
      STALWART_PUBLIC_URL: https://${MAIL_HOST}
    ports:
      - target: 25
        published: 25
        protocol: tcp
        mode: host
      - target: 465
        published: 465
        protocol: tcp
        mode: host
      - target: 587
        published: 587
        protocol: tcp
        mode: host
      - target: 993
        published: 993
        protocol: tcp
        mode: host
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    networks: [FilipeNet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.mail-admin.rule=Host(`${MAIL_HOST}`)
        - traefik.http.routers.mail-admin.entrypoints=websecure
        - traefik.http.routers.mail-admin.tls.certresolver=letsencryptresolver
        - traefik.http.services.mail-admin.loadbalancer.server.port=8080
      restart_policy:
        condition: any

  snappymail:
    image: ${SNAPPYMAIL_IMAGE:-djmaze/snappymail:v2.38.2}
    volumes:
      - snappymail-data:/var/lib/snappymail
    networks: [FilipeNet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.webmail.rule=Host(`${WEBMAIL_HOST}`)
        - traefik.http.routers.webmail.entrypoints=websecure
        - traefik.http.routers.webmail.tls.certresolver=letsencryptresolver
        - traefik.http.services.webmail.loadbalancer.server.port=8888
      restart_policy:
        condition: any

networks:
  FilipeNet:
    external: true

volumes:
  stalwart-etc:
    name: mail_stalwart-etc
  stalwart-data:
    name: mail_stalwart-data
  snappymail-data:
    name: mail_snappymail-data
